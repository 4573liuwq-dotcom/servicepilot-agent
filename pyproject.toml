[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "servicepilot-agent"
version = "0.1.0"
description = "E-commerce after-sales AI agent built with LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.35,<1",
  "langchain>=1.3,<2",
  "langchain-openai>=1.4,<2",
  "langgraph>=1.2,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
insightforge = "insightforge.cli:main"
servicepilot = "insightforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/insightforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
